<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وميض - نظام التكاليف والأسعار</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" id="companyLogo">وميض</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">الرئيسية</a></li>
            <li><a href="materials.html">المواد الخام</a></li>
            <li><a href="products.html">المنتجات</a></li>

            <div class="stat-card">

                <p class="stat-number" id="quotesCount">0</p>

        </div>

        <div class="quick-actions">
            <a href="materials.html" class="btn btn-primary">+ إضافة مادة خام</a>
            <a href="products.html" class="btn btn-primary">+ إضافة منتج</a>
            <a href="quotes.html" class="btn btn-success">+ إنشاء عرض سعر</a>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            updateDashboard();
            loadCompanyInfo();
        });
