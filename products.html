<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات - وضح</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" id="companyLogo">وميض</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="materials.html">المواد الخام</a></li>
            <li><a href="products.html" class="active">المنتجات</a></li>
            <li><a href="quotes.html">عروض الأسعار</a></li>
            <li><a href="company.html">إعدادات الشركة</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>🏭 المنتجات</h1>

        <div class="form-section">
            <h2>إضافة منتج جديد</h2>
            <form id="productForm" onsubmit="addProduct(event)">
                <div class="form-row">
                    <div class="form-group required">
                        <label>اسم المنتج</label>
                        <input type="text" id="prodName" required placeholder="مثال: كرسي خشبي">
                    </div>
                    <div class="form-group required">
                        <label>السعر الأساسي (جنيه)</label>
                        <input type="number" id="prodBasePrice" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>اللون</label>
                        <input type="color" id="prodColor" value="#2196F3">
                    </div>
                    <div class="form-group">
                        <label>الصورة</label>
                        <input type="file" id="prodImage" accept="image/*" onchange="previewImage(event, 'prodPreview')">
                        <img id="prodPreview" class="image-preview" style="display:none;">
                    </div>
                </div>

                <div class="bom-section">
                    <h3>🧩 مكونات المنتج (BOM)</h3>
                    <div id="bomItems"></div>
                    <button type="button" class="btn btn-secondary" onclick="addBomRow()">+ إضافة مكون</button>
                </div>

                <div class="pricing-strategy">
                    <h3>💰 استراتيجية التسعير</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>نوع الزيادة</label>
                            <select id="marginType" onchange="updateMarginLabel()">
                                <option value="percent">نسبة مئوية (%)</option>
                                <option value="fixed">قيمة ثابتة (جنيه)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label id="marginLabel">النسبة (%)</label>
                            <input type="number" id="marginValue" min="0" step="0.01" placeholder="مثال: 20" oninput="calculatePreview()">
                        </div>
                    </div>
                    <div class="calculation-preview" id="calcPreview">
                        <p>التكلفة: <strong id="previewCost">0</strong> جنيه</p>
                        <p>السعر النهائي: <strong id="previewPrice">0</strong> جنيه</p>
                        <p>الربح: <strong id="previewProfit">0</strong> جنيه</p>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">💾 حفظ المنتج</button>
            </form>
        </div>

        <div class="items-container" id="productsContainer"></div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCompanyInfo();
            renderProducts();
            addBomRow();
        });
    </script>
</body>
</html>
