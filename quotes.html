<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض الأسعار - وميض</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">💡</div>
            <span id="companyLogo">وميض</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">🏠 الرئيسية</a></li>
            <li><a href="materials.html">📦 المواد الخام</a></li>
            <li><a href="products.html">🏭 المنتجات</a></li>
            <li><a href="quotes.html" class="active">📋 عروض الأسعار</a></li>
            <li><a href="expenses.html">💸 المصاريف</a></li>
            <li><a href="company.html">⚙️ إعدادات</a></li>
        </ul>
    </nav>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="page-title" style="margin-bottom:1.5rem;">📋 عروض <span style="color:var(--primary);">الأسعار</span></div>

        <div class="form-section">
            <h2>➕ إنشاء عرض سعر جديد</h2>
            <form id="quoteForm" onsubmit="createQuote(event)">
                <div class="form-row">
                    <div class="form-group required">
                        <label>اسم العميل / المشتري</label>
                        <input type="text" id="quoteClient" required placeholder="اسم العميل">
                    </div>
                    <div class="form-group required">
                        <label>تاريخ العرض</label>
                        <input type="date" id="quoteDate" required>
                    </div>
                </div>

                <div id="quoteItems"></div>
                <button type="button" class="btn btn-outline btn-sm" onclick="addQuoteItem()">➕ إضافة منتج</button>

                <div class="quote-summary">
                    <div>
                        <div class="quote-total-label">الإجمالي الكلي</div>
                        <div class="quote-total-amount"><span id="quoteTotal">0.00</span> ج.م</div>
                    </div>
                </div>

                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                    <button type="submit" class="btn btn-success btn-lg">✅ تأكيد الطلب وخصم من المخزون</button>
                    <button type="button" class="btn btn-outline" onclick="printQuote()">🖨️ طباعة عرض السعر</button>
                </div>
            </form>
        </div>

        <div id="quotesList"></div>
    </div>

    <div id="printTemplate" style="display:none;">
        <div class="print-quote">
            <div class="print-header">
                <img id="printLogo" src="" alt="Logo" style="max-height:80px;">
                <div class="print-company">
                    <h2 id="printCompanyName">وميض</h2>
                    <p id="printCompanyAddress"></p>
                    <p id="printCompanyPhones"></p>
                </div>
            </div>
            <hr>
            <div class="print-info" style="margin:1rem 0;">
                <p><strong>عرض سعر رقم:</strong> <span id="printQuoteNo"></span></p>
                <p><strong>التاريخ:</strong> <span id="printQuoteDate"></span></p>
                <p><strong>العميل:</strong> <span id="printClient"></span></p>
            </div>
            <table class="print-table">
                <thead>
                    <tr>
                        <th>#</th><th>المنتج</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th>
                    </tr>
                </thead>
                <tbody id="printItems"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="4" style="text-align:left;font-weight:700;">الإجمالي الكلي:</td>
                        <td style="font-weight:700;"><span id="printTotal"></span> ج.م</td>
                    </tr>
                </tfoot>
            </table>
            <div class="print-footer">
                <p>شكراً لتعاملكم معنا 🙏</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCompanyInfo();
            document.getElementById('quoteDate').valueAsDate = new Date();
            addQuoteItem();
            renderQuotes();
        });
    </script>
</body>
</html>
