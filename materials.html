<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الخام - وضح</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo" id="companyLogo">وميض</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="materials.html" class="active">المواد الخام</a></li>
            <li><a href="products.html">المنتجات</a></li>
            <li><a href="quotes.html">عروض الأسعار</a></li>
            <li><a href="company.html">إعدادات الشركة</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📦 المواد الخام</h1>
            <div class="view-toggle">
                <button class="btn btn-toggle active" onclick="setView('card')">🎴 بطاقات</button>
                <button class="btn btn-toggle" onclick="setView('list')">📋 قائمة</button>
            </div>
        </div>

        <div class="form-section">
            <h2>إضافة مادة خام جديدة</h2>
            <form id="materialForm" onsubmit="addMaterial(event)">
                <div class="form-row">
                    <div class="form-group required">
                        <label>اسم المادة</label>
                        <input type="text" id="matName" required placeholder="مثال: خشب زان">
                    </div>
                    <div class="form-group required">
                        <label>السعر (جنيه)</label>
                        <input type="number" id="matPrice" required min="0" step="0.01" placeholder="0.00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>الكمية في المخزون</label>
                        <input type="number" id="matStock" min="0" step="0.01" placeholder="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>اللون</label>
                        <input type="color" id="matColor" value="#4CAF50">
                    </div>
                    <div class="form-group">
                        <label>الصورة</label>
                        <input type="file" id="matImage" accept="image/*" onchange="previewImage(event, 'matPreview')">
                        <img id="matPreview" class="image-preview" style="display:none;">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">💾 حفظ المادة</button>
            </form>
        </div>

        <div class="items-container" id="materialsContainer"></div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCompanyInfo();
            renderMaterials();
            const savedView = localStorage.getItem('materialsView') || 'card';
            setView(savedView);
        });
    </script>
</body>
</html>
